name: Build APK

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Include detailed hook logs
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build, sign and test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;36.1.0"

      - name: Build, sign and check APK
        env:
          DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python - <<'PY'
          import base64
          import binascii
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          names = ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS')
          secrets = {name: os.environ.pop(name, '') for name in names}
          missing = [name for name in names if not secrets[name]]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          try:
              key_bytes = base64.b64decode(''.join(secrets['KEYSTORE_BASE64'].split()), validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('KEYSTORE_BASE64 must contain valid Base64') from None
          if not key_bytes:
              raise SystemExit('KEYSTORE_BASE64 decodes to an empty file')
          os.umask(0o077)
          with tempfile.TemporaryDirectory(prefix='wearengine-signing-', dir=os.environ['RUNNER_TEMP']) as folder:
              key = Path(folder) / 'key.p12'
              password = Path(folder) / 'key.pass'
              key.write_bytes(key_bytes)
              password.write_text(secrets['KEYSTORE_PASSWORD'], encoding='utf-8')
              args = [sys.executable, 'build.py', '--sdk', os.environ['ANDROID_HOME'],
                      '--jdk', os.environ['JAVA_HOME'], '--fetch-api',
                      '--keystore', str(key), '--ks-alias', secrets['KEY_ALIAS'],
                      '--ks-pass-file', str(password)]
              if os.environ['DIAGNOSTIC'] == 'true':
                  args.append('--diagnostic')
              result = subprocess.run(args)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY

      - name: Write build summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = list(Path('dist').glob('*/build-report.json'))
          if len(reports) != 1:
              raise SystemExit('Expected one build report')
          report = json.loads(reports[0].read_text(encoding='utf-8'))
          if not report['signed'] or not report['certificate_sha256']:
              raise SystemExit('Expected a verified signed APK')
          lines = [
              '## WearEngine Bridge build',
              '',
              f"- Version: {report['version']} (code {report['versionCode']})",
              f"- Variant: {report['variant']}",
              f"- APK: `{report['apk']}`",
              f"- SHA-256: `{report['sha256']}`",
              f"- Signing certificate SHA-256: `{report['certificate_sha256']}`",
              *[f'- {check}' for check in report['tests']],
              '',
              '**Signed APK: signature verified by apksigner. Device testing is still required.**',
              '',
              'Download the APK directly from Artifacts below (no ZIP extraction needed).',
              'No GitHub Release is created.',
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(lines) + '\n')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/*/*-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wearengine-bridge-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/**/*.txt
          if-no-files-found: ignore
          retention-days: 7
